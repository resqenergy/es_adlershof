timeindex:
  start: 2035-01-01 00:00:00
  periods: 8760
  format: "%Y-%m-%d %H:%M:%S"

elements:
  heatpumps:
    component: heatpump
    instances:
      - name: heatpump_mt
        from_bus: electricity
        to_bus: heat_central
        expandable: True
      - name: heatpump_office
        from_bus: electricity
        to_bus: heat_central
        expandable: True
      - name: heatpump_nt
        from_bus: electricity
        to_bus: heat_central
        expandable: True
      - name: heatpump_air
        from_bus: electricity
        to_bus: heat_decentral
        expandable: True
    sequences:
      - efficiency

  flh_heatpumps:
    component: flh_heatpump
    instances:
      - name: heatpump_wastewater
        from_bus: electricity
        to_bus: heat_central
        expandable: True
      - name: heatpump_canal
        from_bus: electricity
        to_bus: heat_central
        expandable: True
    sequences:
      - efficiency

  aquifer_heatpump:
    component: aquifer_heatpump
    sequences:
      - cop
    instances:
      - name: heatpump_aquifer
        electricity_bus: electricity
        aquifer_bus: aquifer
        heat_bus: heat_central
        expandable: True

  volatile:
    component: volatile
    instances:
      - name: pv_roof
        bus: electricity
        expandable: True
      - name: pv_facade
        bus: electricity
        expandable: True
      - name: wind
        bus: electricity
        expandable: True
      - name: heat_lt_central-solarthermal
        bus: heat_lt_central
        expandable: True
      - name: heat_decentral-solarthermal
        bus: heat_decentral
        expandable: True
      - name: heat_central-heat_recovery
        bus: heat_central
        expandable: True
      - name: heat_lt_central-heat_recovery
        bus: heat_lt_central
        expandable: True

  storages:
    component: storage
    instances:
      - name: battery_small
        bus: electricity
        expandable: True
      - name: battery_large
        bus: electricity
        expandable: True
      - name: storage_aquifer
        bus: aquifer
        expandable: True
      - name: storage_pressure
        bus: heat_central
        expandable: True
      - name: storage_buffer
        bus: heat_decentral
        expandable: True

  conversion:
    component: conversion
    instances:
      - name: heat_central-gas_boiler
        from_bus: gas
        to_bus: heat_central
        expandable: True
      - name: heat_decentral-gas_boiler
        from_bus: gas
        to_bus: heat_decentral
        expandable: True
      - name: pth
        from_bus: electricity
        to_bus: heat_central
        expandable: True
      - name: cool_process-absorption
        from_bus: electricity
        to_bus: cool_process
        expandable: True
      - name: cool_process-compression
        from_bus: electricity
        to_bus: cool_process
        expandable: True
      - name: cool_space-compression
        from_bus: electricity
        to_bus: cool_space
        expandable: True
      - name: aquifer-heat_exchanger
        from_bus: heat_central
        to_bus: aquifer
        expandable: True

  backpressures:
    component: backpressure
    instances:
      - name: bhkw
        fuel_bus: gas
        electricity_bus: electricity
        heat_bus: heat_central
        expandable: True

  demands:
    component: load
    instances:
      - name: electricity-residential-demand
        bus: electricity
        profile: electricity-residential
      - name: electricity-non_residential-demand
        bus: electricity
        profile: electricity-non_residential
      - name: mobility-residential-demand
        bus: electricity
        profile: mobility-residential
      - name: mobility-non_residential-demand
        bus: electricity
        profile: mobility-non_residential
      - name: heat_central-residential-demand
        bus: heat_central
        profile: heat_central-residential
      - name: heat_central-non_residential-demand
        bus: heat_central
        profile: heat_central-non_residential
      - name: heat_lt_central-residential-demand
        bus: heat_lt_central
        profile: heat_low_temp_central-residential
      - name: heat_decentral-residential-demand
        bus: heat_decentral
        profile: heat_decentral-residential
      - name: heat_decentral-non_residential-demand
        bus: heat_decentral
        profile: heat_decentral-non_residential
      - name: cool_process-non_residential-demand
        bus: cool_process
        profile: cool_process-non_residential
      - name: cool_space-residential-demand
        bus: cool_space
        profile: cool_space-residential
      - name: cool_space-non_residential-demand
        bus: cool_space
        profile: cool_space-non_residential

  imports:
    component: shortage
    instances:
      - name: electricity-import
        bus: electricity
        capacity: 1000000000
      - name: gas-import
        bus: gas
        capacity: 1000000000
      - name: heat_central-import
        bus: heat_central
        capacity: 1000000000

  exports:
    component: excess
    instances:
      - name: electricity-export
        bus: electricity
        capacity: 1000000000
      - name: heat_central-export
        bus: heat_central
        capacity: 1000000000

  shortages:
    component: shortage
    instances:
      - name: electricity-shortage
        bus: electricity
        capacity: 1000000000
        marginal_cost: 1000000000
      - name: gas-shortage
        bus: gas
        capacity: 1000000000
        marginal_cost: 1000000000
      - name: heat_central-shortage
        bus: heat_central
        capacity: 1000000000
        marginal_cost: 1000000000
      - name: heat_decentral-shortage
        bus: heat_decentral
        capacity: 1000000000
        marginal_cost: 1000000000
      - name: heat_lt_central-shortage
        bus: heat_lt_central
        capacity: 1000000000
        marginal_cost: 1000000000
      - name: cool_process-shortage
        bus: cool_process
        capacity: 1000000000
        marginal_cost: 1000000000
      - name: cool_space-shortage
        bus: cool_space
        capacity: 1000000000
        marginal_cost: 1000000000
      - name: aquifer-shortage
        bus: aquifer
        capacity: 1000000000
        marginal_cost: 1000000000

  excesses:
    component: excess
    instances:
      - name: electricity-excess
        bus: electricity
        capacity: 1000000000
        marginal_cost: 1000000000
      - name: gas-excess
        bus: gas
        capacity: 1000000000
        marginal_cost: 1000000000
      - name: heat_central-excess
        bus: heat_central
        capacity: 1000000000
        marginal_cost: 1000000000
      - name: heat_decentral-excess
        bus: heat_decentral
        capacity: 1000000000
        marginal_cost: 1000000000
      - name: heat_lt_central-excess
        bus: heat_lt_central
        capacity: 1000000000
        marginal_cost: 1000000000
      - name: cool_process-excess
        bus: cool_process
        capacity: 1000000000
        marginal_cost: 1000000000
      - name: cool_space-excess
        bus: cool_space
        capacity: 1000000000
        marginal_cost: 1000000000
      - name: aquifer-excess
        bus: aquifer
        capacity: 1000000000
        marginal_cost: 1000000000
