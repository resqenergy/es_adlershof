 version: 2

 build:
   os: ubuntu-24.04
   tools:
     python: latest
   jobs:
     # Shared by both linked RTD projects (main "de" project + "en"
     # translation project). RTD sets READTHEDOCS_LANGUAGE from each
     # project's own configured language, so this picks the right
     # zensical config and output subtree per project.
     install:
       - pip install zensical
     build:
       html:
         - |
           if [ "$READTHEDOCS_LANGUAGE" = "en" ]; then
             zensical build -f zensical.en.toml
           else
             zensical build
           fi
     post_build:
       - mkdir -p $READTHEDOCS_OUTPUT/html/
       - |
         if [ "$READTHEDOCS_LANGUAGE" = "en" ]; then
           cp --recursive site/en/* $READTHEDOCS_OUTPUT/html/
         else
           cp --recursive site/* $READTHEDOCS_OUTPUT/html/
         fi
